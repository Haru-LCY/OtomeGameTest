<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日乙浓度测试</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f3fb;
        color: #2f2345;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(82, 48, 122, 0.12);
        padding: 20px;
      }
      h1 { margin-top: 0; font-size: 1.8rem; }
      fieldset {
        border: 1px solid #e7d8f6;
        border-radius: 10px;
        margin: 0 0 12px;
        padding: 12px;
      }
      legend { font-weight: 600; }
      label { display: block; margin: 8px 0; cursor: pointer; }
      button {
        border: 0;
        border-radius: 10px;
        background: #8b56d8;
        color: #fff;
        font-size: 1rem;
        padding: 10px 14px;
        cursor: pointer;
      }
      #result {
        margin-top: 14px;
        font-size: 1.05rem;
        line-height: 1.6;
        white-space: pre-line;
      }
      .hint { color: #6b5a86; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>日乙浓度测试（Beta）</h1>
        <p class="hint">参考 <a href="https://galgametest.download/" target="_blank" rel="noopener noreferrer">galgametest.download</a> 的形式，先做一个简洁版「日乙测试」。</p>
        <form id="quiz">
          <fieldset>
            <legend>1. 你一周会主动刷多少次日乙相关内容？</legend>
            <label><input type="radio" name="q1" value="0" required /> 很少刷，偶尔看到</label>
            <label><input type="radio" name="q1" value="1" /> 每周 1-2 次</label>
            <label><input type="radio" name="q1" value="2" /> 基本天天刷</label>
          </fieldset>

          <fieldset>
            <legend>2. 你会因为声优去补作品吗？</legend>
            <label><input type="radio" name="q2" value="0" required /> 不会</label>
            <label><input type="radio" name="q2" value="1" /> 偶尔会</label>
            <label><input type="radio" name="q2" value="2" /> 会，常规操作</label>
          </fieldset>

          <fieldset>
            <legend>3. 你对攻略角色线的偏好是？</legend>
            <label><input type="radio" name="q3" value="0" required /> 随缘，不太刷全线</label>
            <label><input type="radio" name="q3" value="1" /> 喜欢的会二刷</label>
            <label><input type="radio" name="q3" value="2" /> 全线全结局强迫症</label>
          </fieldset>

          <fieldset>
            <legend>4. 你的日乙设备/平台投入情况？</legend>
            <label><input type="radio" name="q4" value="0" required /> 只玩免费或借来的</label>
            <label><input type="radio" name="q4" value="1" /> 有固定平台，偶尔买</label>
            <label><input type="radio" name="q4" value="2" /> 主机+周边+限定版都安排</label>
          </fieldset>

          <button type="submit">生成我的日乙浓度</button>
        </form>
        <div id="result" aria-live="polite"></div>
      </div>
    </main>

    <script>
      const quiz = document.getElementById('quiz');
      const result = document.getElementById('result');
      const questionKeys = [...new Set([...quiz.querySelectorAll('input[type="radio"]')].map((input) => input.name))];

      quiz.addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(quiz);
        const score = questionKeys
          .map((key) => Number(formData.get(key) || 0))
          .reduce((sum, v) => sum + v, 0);

        const maxScore = questionKeys.length * 2;
        const percent = Math.round((score / maxScore) * 100);
        let level = '路过型';
        let message = '你对日乙兴趣刚起步，先从口碑作入门就很不错。';

        if (percent < 40) {
          level = '路过型';
          message = '你对日乙兴趣刚起步，先从口碑作入门就很不错。';
        } else if (percent < 75) {
          level = '稳定摄入型';
          message = '你已经有稳定摄入，继续扩展题材会更有乐趣。';
        } else {
          level = '重度沉浸型';
          message = '你的日乙雷达非常敏锐，新作和老作都难逃你的收藏清单。';
        }

        result.textContent = `测试结果：${level}\n日乙浓度：${percent}%\n${message}`;
      });
    </script>
  </body>
</html>
